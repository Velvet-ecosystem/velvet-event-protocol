[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "velvet-event-protocol"
version = "1.9.0"
description = "Structured event transport and receipt-aware delivery for the Velvet ecosystem"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }

[tool.setuptools]
packages = ["velvet_event_protocol"]
